title: "Workplace Safety Basics"
description: "A short introduction to safe conduct in office and technical work areas."
author: "Safety Team"
questions:
  - id: "emergency-exit"
    text: "What should you do when the evacuation alarm sounds?"
    points: 1000
    timeSeconds: 20
    multiple: false
    answers:
      - id: "exit-immediately"
        text: "Leave by the nearest safe emergency exit"
        correct: true
      - id: "finish-task"
        text: "Finish the current task before leaving"
        correct: false
      - id: "use-elevator"
        text: "Use the elevator to leave faster"
        correct: false
      - id: "wait-for-message"
        text: "Wait at the desk for another message"
        correct: false

  - id: "safe-workstation"
    text: "Which actions help keep a workstation safe?"
    points: 1500
    timeSeconds: 30
    multiple: true
    answers:
      - id: "clear-walkways"
        text: "Keep walkways free of cables and boxes"
        correct: true
      - id: "report-damage"
        text: "Report damaged electrical equipment"
        correct: true
      - id: "block-extinguisher"
        text: "Store deliveries in front of fire extinguishers"
        correct: false
      - id: "daisy-chain"
        text: "Connect several extension leads together"
        correct: false
