name: Browser smoke and PostgreSQL integration
on:
  pull_request:
    paths:
      - 'quizzle/**'
      - 'e2e/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'branding/**'
      - '.github/workflows/browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Real PostgreSQL 16 integration tests (Testcontainers)
        working-directory: quizzle
        run: bash gradlew --no-daemon --console=plain integrationTest
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Browser dependencies, types and discovery
        working-directory: e2e
        run: npm ci && npm run typecheck && npm run test:list && npx playwright install --with-deps chromium
      - name: Generate disposable database password
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Chromium smoke on disposable PostgreSQL + Mailpit
        run: bash e2e/run-ci.sh smoke
      - name: Sanitized failure evidence only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chromium-safe-failure-evidence
          path: e2e/safe-results
          retention-days: 3
