title: "Safety Quest: Bürohelden im Einsatz"
description: "Ein kurzes und humorvolles Quiz über sicheres Verhalten im Büro und in technischen Arbeitsbereichen."
author: "Safety Team"

questions:
  - id: "alarm-action"
    text: "Der Evakuierungsalarm ertönt. Was ist jetzt die beste Reaktion?"
    points: 1000
    timeSeconds: 20
    multiple: false
    answers:
      - id: "nearest-exit"
        text: "Den Arbeitsplatz verlassen und den nächsten sicheren Notausgang benutzen"
        correct: true
      - id: "save-spreadsheet"
        text: "Erst noch die Excel-Datei speichern, formatieren und farblich optimieren"
        correct: false
      - id: "elevator-express"
        text: "Den Aufzug nehmen, weil er schließlich schneller als die Treppe ist"
        correct: false
      - id: "alarm-review"
        text: "Am Schreibtisch bleiben und zunächst eine Besprechung zum Alarm organisieren"
        correct: false

  - id: "mysterious-cable"
    text: "Ein Kabel liegt quer über den Laufweg. Was solltest du tun?"
    points: 1200
    timeSeconds: 20
    multiple: false
    answers:
      - id: "secure-cable"
        text: "Das Kabel sicher verlegen oder die zuständige Stelle informieren"
        correct: true
      - id: "jump-training"
        text: "Es als tägliches Hindernistraining verwenden"
        correct: false
      - id: "decorate-cable"
        text: "Eine kleine Zielflagge danebenstellen, damit niemand vorbeispringt"
        correct: false
      - id: "ignore-cable"
        text: "Ignorieren, bis jemand anderes darüber stolpert"
        correct: false

  - id: "damaged-device"
    text: "Ein elektrisches Gerät riecht verschmort. Welche Reaktionen sind richtig?"
    points: 1500
    timeSeconds: 30
    multiple: true
    answers:
      - id: "stop-use"
        text: "Das Gerät nicht weiter benutzen"
        correct: true
      - id: "report-device"
        text: "Den Schaden sofort an die zuständige Stelle melden"
        correct: true
      - id: "smell-test"
        text: "Noch einmal besonders nah daran riechen, um ganz sicher zu sein"
        correct: false
      - id: "restart-device"
        text: "Das Gerät mehrfach neu starten, bis es wieder Vertrauen fasst"
        correct: false

  - id: "fire-extinguisher"
    text: "Wo ist der beste Platz für die neue Lieferung mit zwölf großen Kartons?"
    points: 1000
    timeSeconds: 20
    multiple: false
    answers:
      - id: "designated-storage"
        text: "In einem dafür vorgesehenen Lager- oder Abstellbereich"
        correct: true
      - id: "emergency-exit-storage"
        text: "Direkt vor dem Notausgang, dort ist auffällig viel Platz"
        correct: false
      - id: "extinguisher-storage"
        text: "Vor dem Feuerlöscher, damit dieser nicht so allein ist"
        correct: false
      - id: "walkway-fortress"
        text: "Mitten im Laufweg als spontane Kartonfestung"
        correct: false

  - id: "extension-leads"
    text: "Die Steckdosen sind alle belegt. Was ist eine sichere Lösung?"
    points: 1500
    timeSeconds: 30
    multiple: false
    answers:
      - id: "request-safe-solution"
        text: "Eine geeignete und freigegebene Stromversorgung organisieren lassen"
        correct: true
      - id: "daisy-chain-max"
        text: "Mehrere Steckdosenleisten verbinden, bis eine elektrische Anakonda entsteht"
        correct: false
      - id: "unplug-colleague"
        text: "Unbemerkt den Bildschirm eines Kollegen ausstecken"
        correct: false
      - id: "creative-wiring"
        text: "Eine improvisierte Verkabelung bauen und sie als Prototyp bezeichnen"
        correct: false

  - id: "spill-response"
    text: "In der Teeküche ist Flüssigkeit auf dem Boden verschüttet. Was hilft?"
    points: 1500
    timeSeconds: 30
    multiple: true
    answers:
      - id: "secure-area"
        text: "Andere Personen auf die Rutschgefahr aufmerksam machen"
        correct: true
      - id: "clean-spill"
        text: "Die Flüssigkeit beseitigen oder die zuständige Stelle informieren"
        correct: true
      - id: "office-skating"
        text: "Den Bereich zum offiziellen Büro-Schlittschuhplatz erklären"
        correct: false
      - id: "paper-cover"
        text: "Ein Blatt Papier darüberlegen und hoffen, dass es niemand bemerkt"
        correct: false

  - id: "technical-area"
    text: "Du möchtest einen gekennzeichneten technischen Arbeitsbereich betreten. Was solltest du beachten?"
    points: 2000
    timeSeconds: 30
    multiple: true
    answers:
      - id: "follow-signs"
        text: "Sicherheitskennzeichnungen und Zutrittsregeln beachten"
        correct: true
      - id: "wear-ppe"
        text: "Vorgeschriebene persönliche Schutzausrüstung tragen"
        correct: true
      - id: "enter-for-curiosity"
        text: "Einfach hineingehen, weil Neugier bekanntlich jede Berechtigung ersetzt"
        correct: false
      - id: "remove-warning"
        text: "Warnschilder entfernen, wenn sie optisch nicht zum Raum passen"
        correct: false

  - id: "final-safety-boss"
    text: "Was zeichnet einen echten Safety Hero aus?"
    points: 2500
    timeSeconds: 30
    multiple: true
    answers:
      - id: "stay-aware"
        text: "Aufmerksam bleiben und Risiken frühzeitig erkennen"
        correct: true
      - id: "report-hazards"
        text: "Gefahren und Beinaheunfälle melden"
        correct: true
      - id: "follow-procedures"
        text: "Sicherheitsregeln und Arbeitsanweisungen befolgen"
        correct: true
      - id: "cape-required"
        text: "Während der Arbeit immer ein flatterndes Superheldencape tragen"
        correct: false
