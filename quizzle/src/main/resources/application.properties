spring.application.name=quizzle
server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.name=QUIZ_ADMIN_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=8h
server.error.include-message=never
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=2KB

quiz.admin.password=${ADMIN_PASSWORD:}
quiz.catalog.directory=${QUIZ_FOLDER:./quizzes}
quiz.branding.directory=${BRANDING_FOLDER:./branding}
quiz.branding.file=${BRANDING_FILE:branding.yaml}
quiz.validation.max-file-bytes=${QUIZ_MAX_FILE_BYTES:1048576}
quiz.validation.max-title-length=${QUIZ_MAX_TITLE_LENGTH:160}
quiz.validation.max-description-length=${QUIZ_MAX_DESCRIPTION_LENGTH:2000}
quiz.validation.max-author-length=${QUIZ_MAX_AUTHOR_LENGTH:120}
quiz.validation.max-id-length=${QUIZ_MAX_ID_LENGTH:80}
quiz.validation.max-question-text-length=${QUIZ_MAX_QUESTION_TEXT_LENGTH:500}
quiz.validation.max-answer-text-length=${QUIZ_MAX_ANSWER_TEXT_LENGTH:300}
quiz.validation.max-questions=${QUIZ_MAX_QUESTIONS:200}
quiz.validation.max-answers-per-question=${QUIZ_MAX_ANSWERS_PER_QUESTION:12}
quiz.validation.max-points=${QUIZ_MAX_POINTS:100000}
quiz.validation.max-time-seconds=${QUIZ_MAX_TIME_SECONDS:600}

quiz.session.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
quiz.session.codehash-length=${SESSION_CODEHASH_LENGTH:10}
quiz.snapshot.database-path=${QUIZ_DATABASE_PATH:./data/quiz-snapshots.db}
quiz.snapshot.interval-ms=${SNAPSHOT_INTERVAL_MS:30000}
quiz.snapshot.busy-timeout-ms=${SQLITE_BUSY_TIMEOUT_MS:5000}

quiz.websocket.heartbeat-interval-ms=${WEBSOCKET_HEARTBEAT_INTERVAL_MS:15000}
quiz.websocket.heartbeat-timeout-ms=${WEBSOCKET_HEARTBEAT_TIMEOUT_MS:40000}
quiz.websocket.disconnect-grace-ms=${WEBSOCKET_DISCONNECT_GRACE_MS:120000}
quiz.websocket.max-name-length=${PLAYER_NAME_MAX_LENGTH:32}
quiz.websocket.max-message-bytes=${WEBSOCKET_MAX_MESSAGE_BYTES:8192}
