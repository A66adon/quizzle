spring.application.name=quizzle
server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.name=QUIZ_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.error.include-message=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=2KB

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/quizzle}
spring.datasource.username=${DATABASE_USER:quizzle}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=10
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
quiz.account.min-password-length=${ACCOUNT_MIN_PASSWORD_LENGTH:8}
quiz.auth.allowed-email-domain=${ALLOWED_EMAIL_DOMAIN:}
quiz.auth.verification-ttl-minutes=${EMAIL_VERIFICATION_TTL_MINUTES:1440}
quiz.auth.reset-ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:30}
quiz.auth.rate-limit.ip-limit=${AUTH_RATE_LIMIT_IP_LIMIT:60}
quiz.auth.google-client-id=${GOOGLE_CLIENT_ID:}
quiz.auth.google-client-secret=${GOOGLE_CLIENT_SECRET:}
quiz.auth.mail-from=${SMTP_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

quiz.branding.directory=${BRANDING_FOLDER:./branding}
quiz.branding.file=${BRANDING_FILE:branding.yaml}
quiz.validation.max-file-bytes=${QUIZ_MAX_FILE_BYTES:1048576}
quiz.validation.max-title-length=${QUIZ_MAX_TITLE_LENGTH:160}
quiz.validation.max-description-length=${QUIZ_MAX_DESCRIPTION_LENGTH:2000}
quiz.validation.max-author-length=${QUIZ_MAX_AUTHOR_LENGTH:120}
quiz.validation.max-id-length=${QUIZ_MAX_ID_LENGTH:80}
quiz.validation.max-question-text-length=${QUIZ_MAX_QUESTION_TEXT_LENGTH:500}
quiz.validation.max-answer-text-length=${QUIZ_MAX_ANSWER_TEXT_LENGTH:300}
quiz.validation.max-questions=${QUIZ_MAX_QUESTIONS:200}
quiz.validation.max-answers-per-question=${QUIZ_MAX_ANSWERS_PER_QUESTION:6}
quiz.validation.max-points=${QUIZ_MAX_POINTS:100000}
quiz.validation.max-time-seconds=${QUIZ_MAX_TIME_SECONDS:600}

quiz.session.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
quiz.session.codehash-length=${SESSION_CODEHASH_LENGTH:10}
quiz.session.auto-advance-delay-ms=${AUTO_ADVANCE_DELAY_MS:5000}
quiz.session.allow-join-after-start=${ALLOW_JOIN_AFTER_START:false}
quiz.snapshot.interval-ms=${SNAPSHOT_INTERVAL_MS:30000}

quiz.websocket.heartbeat-interval-ms=${WEBSOCKET_HEARTBEAT_INTERVAL_MS:15000}
quiz.websocket.heartbeat-timeout-ms=${WEBSOCKET_HEARTBEAT_TIMEOUT_MS:40000}
quiz.websocket.disconnect-grace-ms=${WEBSOCKET_DISCONNECT_GRACE_MS:120000}
quiz.websocket.max-name-length=${PLAYER_NAME_MAX_LENGTH:32}
quiz.websocket.max-message-bytes=${WEBSOCKET_MAX_MESSAGE_BYTES:8192}
