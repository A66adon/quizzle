<!doctype html>
<html lang="en" data-theme-scope="presenter">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow">
	<title data-page-title="Register">Register</title>
	<script>
		(function () {
			var s = document.documentElement.dataset.themeScope || "app";
			var v = localStorage.getItem("quizzle-theme-" + s);
			var t = (v === "dark" || v === "light")
				? v
				: (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
			document.documentElement.dataset.theme = t;
		})();
	</script>
	<link rel="icon" href="/assets/branding-mark">
	<link rel="stylesheet" href="/assets/branding.css">
	<link rel="stylesheet" href="/assets/theme.css">
	<link rel="stylesheet" href="/assets/admin.css">
	<script type="module" src="/assets/branding.js"></script>
	<script type="module" src="/assets/theme.js"></script>
	<script src="/assets/csrf.js"></script>
	<script src="/assets/register.js" defer></script>
</head>
<body class="login-page">
	<button type="button" class="theme-toggle theme-toggle--floating" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode">
		<span class="theme-toggle-icon" aria-hidden="true"></span>
	</button>
	<main class="login-shell">
		<section class="login-card" aria-labelledby="register-title">
			<div class="brand-mark" data-brand-mark aria-hidden="true"></div>
			<h1 class="brand-name"><span data-brand-name></span></h1>
			<h2 id="register-title">Create your account</h2>
			<p class="muted" id="register-hint">Pick a unique username and a password.</p>

			<p class="form-error" id="register-error" role="alert" hidden></p>

			<form action="/register" method="post" class="login-form">
				<label for="username">Username</label>
				<input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="40" required autofocus>
				<label for="password">Password</label>
				<input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
				<button type="submit" class="primary-button">Create account</button>
			</form>
			<p class="muted login-switch">Already have an account? <a href="/login">Sign in</a></p>
		</section>
	</main>
</body>
</html>
