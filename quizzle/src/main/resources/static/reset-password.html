<!doctype html>
<html lang="en" data-theme-scope="presenter">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow">
	<meta name="referrer" content="no-referrer">
	<title>Reset password</title>
	<link rel="stylesheet" href="/assets/branding.css">
	<link rel="stylesheet" href="/assets/theme.css">
	<link rel="stylesheet" href="/assets/admin.css">
	<script type="module" src="/assets/theme.js"></script>
	<script src="/assets/csrf.js"></script>
	<script src="/assets/auth-lifecycle.js" defer></script>
</head>
<body class="login-page">
	<main class="login-shell">
		<section class="login-card" aria-labelledby="auth-title">
			<h1 id="auth-title">Choose a new password</h1>
			<p class="muted">This single-use link expires. After resetting, sign in normally.</p>
			<p id="auth-message" class="muted" role="status" hidden></p>
			<p id="auth-error" class="form-error" role="alert" hidden></p>
			<form action="/reset-password" method="post" class="login-form">
				<input id="reset-token" name="token" type="hidden">
				<label for="password">New password</label>
				<input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required autofocus>
				<label for="password-confirmation">Confirm password</label>
				<input id="password-confirmation" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" required>
				<button type="submit" class="primary-button">Reset password</button>
			</form>
			<p class="muted login-switch"><a href="/forgot-password">Request a new link</a> | <a href="/login">Back to sign in</a></p>
		</section>
	</main>
</body>
</html>
