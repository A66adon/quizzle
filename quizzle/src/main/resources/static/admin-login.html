<!doctype html>
<html lang="en" data-theme-scope="presenter">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow">
	<title data-page-title="Admin login">Admin login</title>
	<script>
		(function () {
			var s = document.documentElement.dataset.themeScope || "app";
			var v = localStorage.getItem("quizzle-theme-" + s);
			var t = (v === "dark" || v === "light")
				? v
				: (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
			document.documentElement.dataset.theme = t;
		})();
	</script>
	<link rel="stylesheet" href="/assets/branding.css">
	<link rel="stylesheet" href="/assets/theme.css">
	<link rel="stylesheet" href="/assets/admin.css">
	<script type="module" src="/assets/branding.js"></script>
	<script type="module" src="/assets/theme.js"></script>
	<script src="/assets/admin-login.js" defer></script>
</head>
<body class="login-page">
	<button type="button" class="theme-toggle theme-toggle--floating" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode">
		<span class="theme-toggle-icon" aria-hidden="true">🌙</span>
	</button>
	<main class="login-shell">
		<section class="login-card" aria-labelledby="login-title">
			<div class="brand-mark" data-brand-mark aria-hidden="true"></div>
			<h1 class="brand-name"><span data-brand-name></span></h1>
			<h2 id="login-title">Admin access</h2>
			<p class="muted">Sign in to choose and present a quiz.</p>

			<p class="form-error" id="login-error" role="alert" hidden>
				The password is incorrect. Please try again.
			</p>

			<form action="/admin/login" method="post" class="login-form">
				<label for="password">Password</label>
				<input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
				<button type="submit" class="primary-button">Sign in</button>
			</form>
		</section>
	</main>
</body>
</html>
