services:
  quizzle:
    build: .
    container_name: quizzle
    environment:
      - ALLOWED_EMAIL_DOMAIN=${ALLOWED_EMAIL_DOMAIN:?set ALLOWED_EMAIL_DOMAIN before starting}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8080}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
    ports:
      - "8080:8080"
    volumes:
      - ./quizzes:/data/quizzes
      - ./branding:/data/branding:ro
      - quizzle-db:/data/db
    restart: unless-stopped

volumes:
  quizzle-db:
