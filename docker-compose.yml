services:
  quizzle:
    build: .
    container_name: quizzle
    environment:
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8080}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
    ports:
      - "8080:8080"
    volumes:
      - quizzle-data:/data
    restart: unless-stopped

volumes:
  quizzle-data:
